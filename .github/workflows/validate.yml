name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/npm/package-lock.json
      - name: Install validation dependencies
        shell: pwsh
        run: npm ci --prefix runtime/npm --ignore-scripts --no-audit --no-fund
      - name: Validate public source
        shell: pwsh
        run: ./scripts/validate-source.ps1
