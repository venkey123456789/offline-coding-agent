name: Bug report
description: Report a reproducible problem with the local agent stack
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the launcher, model, and smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Ollama, Node.js, and Python versions
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Remove usernames, tokens, private code, and personal chat content.
      render: text
